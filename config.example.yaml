# ============================================================
# CRYPTO BIG-CRASH DETECTOR - CONFIGURATION (EXAMPLE)
# Copy this file to "config.yaml" and fill in your values.
#   copy config.example.yaml config.yaml
# config.yaml is git-ignored so your secrets never reach GitHub.
# ============================================================

# Coins to monitor (just ticker symbols — Binance pair auto-derived as SYM+USDT)
coins:
  - BTC
  - BNB
  - TAO
  - ETH
  - SOL
  - LINK
  - LTC
  - SUI
  - APT
  - FET

# Crash thresholds. A coin alerts when it drops MORE than this %
# within the listed window.
thresholds:
  1m: 5
  5m: 7
  15m: 10
  1h: 15
  4h: 20
  24h: 30

# How often to check prices (seconds). 60 = once per minute (1 API call/min).
check_interval: 60

# Anti-spam / cooldown per coin.
cooldown:
  enabled: true
  recovery_percent: 3
  min_minutes_between_alerts: 30

# Rolling history retention (minutes). Keep enough to cover the
# longest threshold window (24h) plus buffer.
history_retention_minutes: 1500

# Telegram notifications.
telegram:
  enabled: false
  bot_token: "PASTE_YOUR_BOT_TOKEN_HERE"
  chat_id: "PASTE_YOUR_CHAT_ID_HERE"

# Dashboard display.
dashboard:
  enabled: true
  title: "CRYPTO CRASH DETECTOR"